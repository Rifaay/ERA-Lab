# Supabase pauses a free project after 7 days without use. This asks the database for "1" every 3 days.
# Needs the repository variables SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY (Settings → Secrets and variables → Actions → Variables).
# GitHub stops scheduled runs after 60 days with no commits; re-enable it from the Actions tab if that happens.
name: Keep the database awake

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    if: vars.SUPABASE_URL != ''
    steps:
      - run: |
          curl --fail-with-body -sS -X POST "${{ vars.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}" -H "Content-Type: application/json" -d '{}'
